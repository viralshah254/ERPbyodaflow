name: Frontend build

on:
  push:
    branches: [liveness, main]
  pull_request:
    branches: [liveness, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Firebase messaging service worker
        run: npm run generate:firebase-sw

      - name: Build
        run: npm run build
