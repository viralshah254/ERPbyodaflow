name: Frontend build

on:
  push:
    branches: [liveness, main]
  pull_request:
    branches: [liveness, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"
      NEXT_PUBLIC_ERP_REVISION: ${{ github.sha }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Regression tests
        run: npm test

      - name: Generate Firebase messaging service worker
        run: npm run generate:firebase-sw

      - name: Validate and export canonical Gaia handbook
        run: npm run tutorials:export -- --output /tmp/erp-tutorials.json

      - name: Build
        run: npm run build

      - name: Preserve the handbook for the matching Gaia release
        uses: actions/upload-artifact@v4
        with:
          name: erp-handbook-${{ github.sha }}
          path: /tmp/erp-tutorials.json
          if-no-files-found: error
